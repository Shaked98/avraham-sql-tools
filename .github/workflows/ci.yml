name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit and fixture tests
        run: cargo test --workspace
      - name: release build
        run: cargo build --release -p sql-replay
      - name: scale tests (1M-event streaming memory bound; release mode)
        run: cargo test --release -p sql-replay --test scale -- --ignored --nocapture

  musl:
    # The RHEL 8 deployment artifact is the static musl binary; build it on
    # every PR so it cannot rot between releases, and smoke the RPM spec.
    name: static musl build + rpm spec
    runs-on: ubuntu-latest
    env:
      MUSL_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: install musl-gcc and rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rpm
      - name: build static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target "$MUSL_TARGET" -p sql-replay
      - name: verify the binary is fully static
        run: |
          BIN="target/$MUSL_TARGET/release/sql-replay"
          # rustc emits static-PIE for the musl target; file says
          # "static-pie linked" and ldd says "statically linked".
          file "$BIN" | grep -Eq 'statically linked|static-pie linked'
          if ldd "$BIN" 2>&1 | grep -Evq 'not a dynamic executable|statically linked'; then
            echo "binary is not static:"; ldd "$BIN"; exit 1
          fi
      - name: smoke-run the static binary
        run: |
          BIN="target/$MUSL_TARGET/release/sql-replay"
          "$BIN" --version
          "$BIN" capture \
            --input crates/sql-replay/tests/fixtures/replay_smoke.log \
            --out smoke.jsonl.zst
      - name: rpm spec version matches the crate
        run: |
          VERSION=$(grep '^version = ' crates/sql-replay/Cargo.toml | cut -d'"' -f2)
          grep -q "%global version $VERSION" packaging/sql-replay.spec || {
            echo "packaging/sql-replay.spec default version != crate version $VERSION"
            exit 1
          }
      - name: build the RPM from the spec (structure smoke)
        run: |
          VERSION=$(grep '^version = ' crates/sql-replay/Cargo.toml | cut -d'"' -f2)
          PKG="sql-replay-$VERSION-$MUSL_TARGET"
          mkdir -p "dist/$PKG"
          cp "target/$MUSL_TARGET/release/sql-replay" README.md \
             LICENSE-MIT LICENSE-APACHE "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          rpmbuild -bb packaging/sql-replay.spec \
            --define "_sourcedir $PWD/dist" \
            --define "_rpmdir $PWD/dist" \
            --define "version $VERSION"
          rpm -qpil dist/x86_64/sql-replay-*.rpm

  integration:
    name: replay vs MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.7", "8.0"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sqlreplay
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release -p sql-replay
      - name: capture the smoke fixture
        run: |
          ./target/release/sql-replay capture \
            --input crates/sql-replay/tests/fixtures/replay_smoke.log \
            --out capture.jsonl.zst
      - name: replay against MySQL ${{ matrix.mysql }}
        run: |
          ./target/release/sql-replay replay \
            --capture capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --max-connections 8 \
            --out run.json
      - name: assert run.json sanity
        run: |
          jq . run.json
          jq -e '.totals.events == 12' run.json
          jq -e '.totals.sessions == 3' run.json
          jq -e '.totals.executed == 10' run.json
          jq -e '.totals.skipped == 2' run.json
          jq -e '.totals.errors == 0' run.json
          jq -e '.totals.not_run == 0' run.json
          jq -e '.totals.qps > 0' run.json
          jq -e '.target_server_version | startswith("${{ matrix.mysql }}")' run.json
          jq -e '.fingerprints | length == 12' run.json
          jq -e '[.fingerprints[] | select(.count > 0) | .p50_us] | all(. >= 1)' run.json
          jq -e '[.fingerprints[] | select(.skipped > 0)] | length == 2' run.json
          jq -e '[.fingerprints[] | select(.skipped > 0) | .count] | all(. == 0)' run.json
          jq -e '.flags.allow_writes == false' run.json
          # target settings are recorded on both 5.7 and 8.0 (name of the
          # isolation variable differs across versions; both map to the
          # canonical key)
          jq -e '.target_settings.sql_mode | type == "string"' run.json
          jq -e '.target_settings.character_set_server | type == "string"' run.json
          jq -e '.target_settings.collation_server | type == "string"' run.json
          jq -e '.target_settings.innodb_buffer_pool_size | type == "string"' run.json
          jq -e '.target_settings.transaction_isolation | type == "string"' run.json
          # --speed max has no pacing schedule, so no pacing block
          jq -e 'has("pacing") | not' run.json
      - name: paced replay (--speed 20) against MySQL ${{ matrix.mysql }}
        run: |
          ./target/release/sql-replay replay \
            --capture capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --max-connections 8 \
            --speed 20 \
            --out run-paced.json
      - name: assert run-paced.json pacing metrics
        run: |
          jq . run-paced.json
          jq -e '.totals.executed == 10' run-paced.json
          jq -e '.flags.speed == "20"' run-paced.json
          jq -e '.pacing.speed == 20' run-paced.json
          # all 12 events are paced (skipped writes still hold their slot in
          # the timeline); 10 execute
          jq -e '.pacing.paced_events == 12' run-paced.json
          jq -e '.pacing.max_lag_us >= 0' run-paced.json
          jq -e '.pacing.mean_lag_us >= 0' run-paced.json
          # capture spans 3s -> at 20x the paced run takes >= ~150ms
          jq -e '.wall_secs >= 0.14' run-paced.json
      - name: warmup + repeated replay (--warmup --repeat 3) against MySQL ${{ matrix.mysql }}
        run: |
          ./target/release/sql-replay replay \
            --capture capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --max-connections 8 \
            --warmup \
            --repeat 3 \
            --out run-repeat.json
      - name: assert per-pass reports and the median aggregate
        run: |
          jq . run-repeat.json
          for i in 1 2 3; do
            jq -e '.totals.executed == 10' "run-repeat.pass$i.json"
            jq -e 'has("aggregation") | not' "run-repeat.pass$i.json"
            jq -e '.aborted == false' "run-repeat.pass$i.json"
          done
          jq -e '.aggregation.passes == 3' run-repeat.json
          jq -e '.aggregation.method == "median"' run-repeat.json
          jq -e '.totals.executed == 10' run-repeat.json
          jq -e '.flags.warmup == true' run-repeat.json
          jq -e '.aborted == false' run-repeat.json
      - name: filtered replay (--filter-user + --time-window) against MySQL ${{ matrix.mysql }}
        # The fixture spans 1693569601..1693569604 for user `smoke`; the
        # window keeps the middle 6 events.
        run: |
          ./target/release/sql-replay replay \
            --capture capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --max-connections 8 \
            --filter-user smoke \
            --time-window 1693569602..1693569604 \
            --out run-filtered.json
          jq . run-filtered.json
          jq -e '.totals.events == 6' run-filtered.json
          jq -e '.totals.filtered == 6' run-filtered.json
          jq -e '.totals.errors == 0' run-filtered.json
          jq -e '.flags.filter_user == "smoke"' run-filtered.json
          jq -e '.flags.time_window == "1693569602..1693569604"' run-filtered.json
      - name: pooled replay (--pool 2) against MySQL ${{ matrix.mysql }}
        run: |
          ./target/release/sql-replay replay \
            --capture capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --pool 2 \
            --out run-pool.json
          jq . run-pool.json
          jq -e '.totals.executed == 9' run-pool.json
          jq -e '.totals.skipped == 3' run-pool.json
          jq -e '.totals.errors == 0' run-pool.json
          jq -e '.flags.pool == 2' run-pool.json
      - name: upload run.json for the compare job
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.mysql }}
          path: run.json
      - name: replay with --db-override against MySQL ${{ matrix.mysql }}
        run: |
          ./target/release/sql-replay replay \
            --capture capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --max-connections 8 \
            --db-override sqlreplay \
            --out run-override.json
      - name: assert run-override.json sanity
        run: |
          jq . run-override.json
          jq -e '.totals.events == 12' run-override.json
          jq -e '.totals.executed == 9' run-override.json
          jq -e '.totals.skipped == 3' run-override.json
          jq -e '.totals.errors == 0' run-override.json
          jq -e '.totals.not_run == 0' run-override.json
          jq -e '.flags.db_override == "sqlreplay"' run-override.json
      - name: env-gated live integration test
        run: cargo test -p sql-replay --test replay_integration
        env:
          SQL_REPLAY_TEST_URL: mysql://root@127.0.0.1:3306/sqlreplay

      # ---- M4 pcap leg: tcpdump real wire traffic, capture, replay ----
      - name: tcpdump a scripted wire workload
        run: |
          # The service container's port is published on 127.0.0.1 via
          # docker-proxy, so client<->server traffic crosses `lo`.
          sudo tcpdump -i lo port 3306 -s 0 -U -w traffic.pcap &
          TCPDUMP_PID=$!
          sleep 2
          # Binary-protocol prepared statements with bound parameters —
          # something the plain mysql CLI never sends.
          cargo run --release -p sql-replay --example wire_workload -- \
            mysql://root@127.0.0.1:3306/sqlreplay
          # The stock mysql 8.x CLI (negotiates CLIENT_QUERY_ATTRIBUTES).
          # TLS must be off or the whole connection is opaque on the wire.
          mysql -h 127.0.0.1 -P 3306 -u root --ssl-mode=DISABLED sqlreplay \
            -e "SELECT id, v FROM pcap_smoke WHERE id = 2; SELECT COUNT(*) FROM pcap_smoke;"
          sleep 2
          sudo kill -INT "$TCPDUMP_PID"
          sleep 2
          sudo chmod a+r traffic.pcap
          ls -l traffic.pcap
      - name: capture from the pcap and assert decode quality
        run: |
          ./target/release/sql-replay capture \
            --input traffic.pcap \
            --out pcap-capture.jsonl.zst | tee pcap-capture.txt
          # dialect carries the observed server version
          grep -E 'dialect: pcap:' pcap-capture.txt
          # every prepared execution expanded; nothing skipped or lost
          grep -E 'prepared statements: [1-9][0-9]* expanded, 0 inexpandable' pcap-capture.txt
          grep -E '0 TLS-skipped, 0 compressed-skipped, 0 mid-stream-skipped, 0 broken' pcap-capture.txt
          grep -E '0 responses missing' pcap-capture.txt
      - name: replay the pcap capture against MySQL ${{ matrix.mysql }}
        run: |
          ./target/release/sql-replay replay \
            --capture pcap-capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --max-connections 8 \
            --out run-pcap.json
          jq . run-pcap.json
          jq -e '.totals.events >= 12' run-pcap.json
          # setup session + 2 concurrent readers + the mysql CLI
          jq -e '.totals.sessions >= 4' run-pcap.json
          jq -e '.totals.errors == 0' run-pcap.json
          jq -e '.totals.executed >= 8' run-pcap.json
          # writes in the captured workload stayed behind the gate
          jq -e '.totals.skipped >= 5' run-pcap.json
          # the prepared lookups round-tripped into replayable SQL text
          jq -e '[.fingerprints[] | select(.fingerprint | contains("where id ="))] | length >= 1' run-pcap.json
      - name: baseline from the pcap capture (recorded wire latencies)
        run: |
          ./target/release/sql-replay baseline \
            --capture pcap-capture.jsonl.zst \
            --out pcap-baseline.json
          jq -e '.latency_source == "recorded-slow-log"' pcap-baseline.json
          jq -e '.totals.events >= 12' pcap-baseline.json
          # SELECT SLEEP(0.25)'s request->response wire latency was recorded
          jq -e '[.fingerprints[] | select(.fingerprint | contains("sleep")) | select(.p95_us >= 200000)] | length >= 1' pcap-baseline.json

      # ---- M4 checksum legs: correctness diffing on live data ----
      # These legs gate on the correctness section only; sub-millisecond
      # loopback latencies are scheduler noise on shared runners, so the
      # latency threshold is set out of reach to keep exit codes
      # correctness-driven.
      - name: checksum leg — identical data yields zero mismatches
        run: |
          ./target/release/sql-replay replay \
            --capture pcap-capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --checksum --out run-cs-base.json
          ./target/release/sql-replay replay \
            --capture pcap-capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --checksum --out run-cs-same.json
          jq -e '.flags.checksum == true' run-cs-base.json
          jq -e '[.fingerprints[] | select(.checksum != null)] | length >= 3' run-cs-base.json
          ./target/release/sql-replay compare \
            --baseline run-cs-base.json \
            --candidate run-cs-same.json \
            --threshold-pct 100000 \
            --json cs-same-report.json
          jq -e '.correctness.checked >= 3' cs-same-report.json
          jq -e '.correctness.matched == .correctness.checked' cs-same-report.json
          jq -e '.correctness.mismatches | length == 0' cs-same-report.json
          jq -e '.correctness_failed == false' cs-same-report.json
      - name: checksum leg — planted data change is detected (exit 2)
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root --ssl-mode=DISABLED sqlreplay \
            -e "UPDATE pcap_smoke SET v = 'tampered' WHERE id = 1"
          ./target/release/sql-replay replay \
            --capture pcap-capture.jsonl.zst \
            --url mysql://root@127.0.0.1:3306/sqlreplay \
            --checksum --out run-cs-tampered.json
          set +e
          ./target/release/sql-replay compare \
            --baseline run-cs-base.json \
            --candidate run-cs-tampered.json \
            --threshold-pct 100000 \
            --json cs-tampered-report.json \
            --out cs-tampered-report.html
          code=$?
          set -e
          test "$code" -eq 2
          jq -e '.correctness_failed == true' cs-tampered-report.json
          jq -e '.correctness.mismatches | length >= 1' cs-tampered-report.json
          jq -e '[.correctness.mismatches[] | select(.fingerprint | contains("pcap_smoke"))] | length >= 1' cs-tampered-report.json
          # the unchanged aggregate stayed matched (no blanket mismatching)
          jq -e '.correctness.matched >= 1' cs-tampered-report.json
          grep -q 'Result correctness' cs-tampered-report.html
          ! grep -qE 'https?://' cs-tampered-report.html

  compare:
    name: compare 5.7 vs 8.0 runs
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release -p sql-replay
      - uses: actions/download-artifact@v4
        with:
          name: run-5.7
          path: run-5.7
      - uses: actions/download-artifact@v4
        with:
          name: run-8.0
          path: run-8.0
      - name: compare the real 5.7 run against the 8.0 run
        # The smoke fixture executes each fingerprint once, so --min-count 2
        # keeps every fingerprint out of the headline ranking: exit code 0
        # is deterministic while the report still carries the full deltas.
        run: |
          ./target/release/sql-replay compare \
            --baseline run-5.7/run.json \
            --candidate run-8.0/run.json \
            --min-count 2 \
            --json report.json \
            --out report.html
      - name: assert compare report shape
        run: |
          jq . report.json
          jq -e '.baseline.target_server_version | startswith("5.7")' report.json
          jq -e '.candidate.target_server_version | startswith("8.0")' report.json
          jq -e '.regressed == false' report.json
          jq -e '.regressions | length == 0' report.json
          jq -e '.low_sample | length >= 10' report.json
          jq -e '.only_in_baseline | length == 0' report.json
          jq -e '.only_in_candidate | length == 0' report.json
          jq -e '.count_mismatches == 0' report.json
          jq -e '.totals.baseline_qps > 0 and .totals.candidate_qps > 0' report.json
          # 5.7 and 8.0 defaults differ (sql_mode, charset/collation), so the
          # settings diff and its comparability warning must be present
          jq -e '.settings_diff | length >= 1' report.json
          jq -e '[.settings_diff[].name] | index("character_set_server") != null' report.json
          jq -e '.comparability_warnings | length >= 1' report.json
          # the HTML report must be self-contained (no external requests)
          test -s report.html
          ! grep -qE 'https?://' report.html
      - name: build a recorded baseline from the smoke fixture capture
        run: |
          ./target/release/sql-replay capture \
            --input crates/sql-replay/tests/fixtures/replay_smoke.log \
            --out capture.jsonl.zst
          ./target/release/sql-replay baseline \
            --capture capture.jsonl.zst \
            --out baseline.json
          jq . baseline.json
          jq -e '.latency_source == "recorded-slow-log"' baseline.json
          # no replay target: url/version/settings are absent, not blank
          jq -e 'has("target_url") | not' baseline.json
          jq -e 'has("target_server_version") | not' baseline.json
          jq -e 'has("target_settings") | not' baseline.json
          # every logged event ran on production; the log records no errors
          jq -e '.totals.events == 12 and .totals.executed == 12' baseline.json
          jq -e '.totals.errors == 0 and .totals.skipped == 0' baseline.json
          jq -e '.totals.sessions == 3' baseline.json
          # the capture's own timeline: 1693569601..1693569604
          jq -e '.started_at == "2023-09-01T12:00:01Z"' baseline.json
          jq -e '.wall_secs == 3' baseline.json
          jq -e '.totals.qps == 4' baseline.json
          jq -e '.fingerprints | length == 12' baseline.json
          # the recorded SELECT SLEEP(0.05) Query_time lands per-fingerprint
          jq -e '[.fingerprints[] | select(.p95_us >= 49000 and .p95_us <= 51000)] | length == 1' baseline.json
      - name: compare the recorded baseline against the real 8.0 replay run
        # Same determinism trick as above: --min-count 2 keeps the
        # count-1 fingerprints out of the headline ranking, so exit code 0.
        run: |
          ./target/release/sql-replay compare \
            --baseline baseline.json \
            --candidate run-8.0/run.json \
            --min-count 2 \
            --json recorded-report.json \
            --out recorded-report.html | tee recorded-compare.txt
          jq . recorded-report.json
          jq -e '.baseline.latency_source == "recorded-slow-log"' recorded-report.json
          jq -e '.candidate.latency_source == "replayed"' recorded-report.json
          jq -e '.regressed == false' recorded-report.json
          # the recorded-vs-replayed measurement-plane warning is present
          jq -e '[.comparability_warnings[] | select(contains("MEASUREMENT PLANES DIFFER"))] | length == 1' recorded-report.json
          grep -q 'MEASUREMENT PLANES DIFFER' recorded-compare.txt
          # settings diff skipped gracefully; version slot shows provenance
          jq -e '.settings_diff | length == 0' recorded-report.json
          jq -e '.settings_note | contains("recorded from the slow log")' recorded-report.json
          grep -q 'recorded (slow log)' recorded-compare.txt
          grep -q 'recorded (slow log)' recorded-report.html
          grep -q 'settings diff skipped' recorded-report.html
          # still self-contained HTML
          ! grep -qE 'https?://' recorded-report.html
      - name: exit code 2 on the known-regression fixture pair
        run: |
          set +e
          ./target/release/sql-replay compare \
            --baseline crates/sql-replay/tests/fixtures/run-baseline.json \
            --candidate crates/sql-replay/tests/fixtures/run-candidate.json \
            > /dev/null
          code=$?
          set -e
          test "$code" -eq 2
      - name: upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: report.html
